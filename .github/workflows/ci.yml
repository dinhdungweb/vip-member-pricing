name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: vip_pricing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vip_pricing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
      - run: npm ci
      - name: Create migration and runtime roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d vip_pricing <<'SQL'
          CREATE ROLE vip_pricing_migrate LOGIN PASSWORD 'migrate';
          CREATE ROLE vip_pricing LOGIN PASSWORD 'runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          GRANT ALL PRIVILEGES ON DATABASE vip_pricing TO vip_pricing_migrate;
          GRANT USAGE, CREATE ON SCHEMA public TO vip_pricing_migrate;
          GRANT USAGE ON SCHEMA public TO vip_pricing;
          ALTER DEFAULT PRIVILEGES FOR ROLE vip_pricing_migrate IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO vip_pricing;
          ALTER DEFAULT PRIVILEGES FOR ROLE vip_pricing_migrate IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO vip_pricing;
          SQL
      - name: Generate and migrate
        env:
          DIRECT_URL: postgresql://vip_pricing_migrate:migrate@127.0.0.1:5432/vip_pricing
        run: |
          npm run db:generate
          npm run db:deploy
          npm exec prisma validate
      - name: Verify application
        env:
          TEST_DATABASE_URL: postgresql://vip_pricing:runtime@127.0.0.1:5432/vip_pricing
          SHOPIFY_API_KEY: test
          SHOPIFY_API_SECRET: test
          SHOPIFY_APP_URL: https://example.test
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: Build Shopify extensions
        run: |
          npm install --global @shopify/cli@4.5.2
          rustup target add wasm32-unknown-unknown
          rustfmt --edition 2021 --check extensions/member-discount/src/*.rs
          rustfmt --edition 2021 --check extensions/member-validation/src/*.rs
          shopify app build --skip-dependencies-installation
      - name: Enforce storefront bundle budget
        run: |
          node -e "const fs=require('fs'),z=require('zlib');const n=z.gzipSync(fs.readFileSync('extensions/member-storefront/assets/member-pricing.js')).length;if(n>20480)throw new Error('Storefront JS exceeds 20 KB gzip: '+n)"
