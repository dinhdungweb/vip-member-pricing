services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vip_pricing
      POSTGRES_USER: postgres
      PGDATA: /var/lib/postgresql/data
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?required}
      VIP_RUNTIME_DB_PASSWORD: ${VIP_RUNTIME_DB_PASSWORD:?required}
      VIP_WORKER_DB_PASSWORD: ${VIP_WORKER_DB_PASSWORD:?required}
      VIP_MIGRATION_DB_PASSWORD: ${VIP_MIGRATION_DB_PASSWORD:?required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./ops/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vip_pricing"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?required}"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: vip_pricing
      DB_USER: vip_pricing
      DB_PASSWORD: ${VIP_RUNTIME_DB_PASSWORD:?required}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 300
      DEFAULT_POOL_SIZE: 30
    ports:
      - "127.0.0.1:6432:5432"
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    build: .
    command: ["npm", "run", "db:deploy"]
    environment:
      DIRECT_URL: postgresql://vip_pricing_migrate:${VIP_MIGRATION_DB_PASSWORD}@postgres:5432/vip_pricing
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      DATABASE_URL: postgresql://vip_pricing:${VIP_RUNTIME_DB_PASSWORD}@pgbouncer:5432/vip_pricing
      DIRECT_URL: postgresql://vip_pricing_migrate:${VIP_MIGRATION_DB_PASSWORD}@postgres:5432/vip_pricing
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PORT: 3000
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["npm", "run", "worker"]
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      DATABASE_URL: postgresql://vip_pricing:${VIP_RUNTIME_DB_PASSWORD}@pgbouncer:5432/vip_pricing
      DIRECT_URL: postgresql://vip_pricing_migrate:${VIP_MIGRATION_DB_PASSWORD}@postgres:5432/vip_pricing
      MAINTENANCE_DATABASE_URL: postgresql://vip_pricing_worker:${VIP_WORKER_DB_PASSWORD}@postgres:5432/vip_pricing
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ops/certs:/etc/nginx/certs:ro
    depends_on:
      - web

volumes:
  postgres-data:
