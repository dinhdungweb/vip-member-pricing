api_version = "2026-07"
uid = "bb93c33d-0c5c-7a44-3d45-8ece48c819b80e6f9022"

[[extensions]]
name = "VIP member product access"
handle = "member-validation"
type = "function"
description = "Blocks restricted products for guests and ineligible tiers."

  [[extensions.targeting]]
  target = "cart.validations.generate.run"
  input_query = "src/cart_validations_generate_run.graphql"
  export = "cart_validations_generate_run"

  [extensions.build]
  command = "cargo build --target=wasm32-unknown-unknown --release"
  path = "target/wasm32-unknown-unknown/release/member_validation.wasm"
  watch = ["src/**/*.rs"]

